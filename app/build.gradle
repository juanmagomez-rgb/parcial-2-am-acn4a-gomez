plugins {
    alias(libs.plugins.android.application)
}

android {
    buildFeatures { buildConfig true }
    namespace 'com.example.mispeliculas'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.example.mispeliculas"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "1.0"
        def tmdb = new Properties()
        def archivo = rootProject.file('tmdb.properties')
        if (archivo.exists()) archivo.withInputStream { tmdb.load(it) }
        buildConfigField 'String', 'TMDB_TOKEN', groovy.json.JsonOutput.toJson(tmdb.getProperty('tokenTmdb', '').trim())

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}
